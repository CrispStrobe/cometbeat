name: macOS Release (App Store)

# Builds, signs and uploads the macOS app to App Store Connect from CI —
# the macOS twin of ios-release.yml.
#
# It exists because macOS build 3 was made BY HAND on a laptop, which is why
# nobody could reproduce it and why the platform silently fell behind iOS.
#
# Triggers:
#   * push a tag matching mac-v*   -> full build + upload (a real release)
#   * manual "Run workflow"        -> dry_run=true builds and signs WITHOUT
#                                     uploading (validates signing safely)
#
# Secrets — the same App Store Connect key as iOS, plus two macOS-only ones:
#   ASC_API_KEY_P8_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID / ASC_APP_ID / ASC_TEAM_ID
#   MAC_DIST_P12_BASE64   base64 of a .p12 holding BOTH macOS signing identities:
#                         "Apple Distribution" (signs the .app) AND
#                         "3rd Party Mac Developer Installer" (signs the .pkg).
#                         ⚠️ The iOS `DIST_CERT_P12_BASE64` is NOT enough — it
#                         carries only the app-signing cert, and the App Store
#                         .pkg cannot be produced without the installer one.
#   MAC_DIST_P12_PASSWORD password for that .p12
#   MAC_PROFILE_BASE64    base64 of the MAC_APP_STORE .provisionprofile
#                         (ASC profile "CometBeat Mac App Store", 4LP8GG7P97)
#
# The build number comes from pubspec.yaml (version: x.y.z+BUILD). Bump BUILD
# before releasing, or Apple rejects a duplicate CFBundleVersion.

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.crispstrobe.cometBeat
  PROFILE_NAME: CometBeat Mac App Store
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    # Same sibling layout as ios-release.yml / ci.yml — the app path-depends on
    # ../crisp_notation.
    defaults:
      run:
        working-directory: cometbeat
    steps:
      - name: Checkout cometbeat
        uses: actions/checkout@v4
        with:
          path: cometbeat

      - name: Checkout crisp_notation (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp_notation
          ref: main
          path: crisp_notation

      - name: Checkout CrispEmbed (sibling FFI path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/CrispEmbed
          ref: main
          path: CrispEmbed

      - name: Checkout onnx_runtime_dart (sibling dev path dependency)
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/onnx_runtime_dart
          ref: main
          path: onnx_runtime_dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import signing certificates into a temp keychain
        env:
          P12_B64: ${{ secrets.MAC_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.MAC_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/cometbeat-mac-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/macdist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/macdist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KC_PW" "$KC" >/dev/null
          echo "== codesigning identities =="
          security find-identity -v -p codesigning "$KC"
          echo "== all identities (the installer cert is NOT a codesigning one) =="
          security find-identity -v "$KC"
          # Fail LOUDLY here rather than at productbuild: the commonest setup
          # mistake is reusing the iOS p12, which has no installer identity.
          security find-identity -v "$KC" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "::error::MAC_DIST_P12_BASE64 has no '3rd Party Mac Developer Installer' identity — the App Store .pkg cannot be signed. Export a p12 containing BOTH identities."; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/cometbeat.provisionprofile"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/cometbeat.provisionprofile")")
          # macOS profiles live here (NOT the iOS MobileDevice dir), and Xcode
          # 16+ also reads the UserData one.
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/cometbeat.provisionprofile" "$DIR/$UUID.provisionprofile"
          done
          echo "installed profile UUID $UUID; name:"
          /usr/libexec/PlistBuddy -c 'Print :Name' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/cometbeat.provisionprofile")"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist (manual signing)
        run: |
          # `installerSigningCertificate` is the macOS-only key that turns the
          # export into a signed .pkg. Without it the export produces an .app
          # and the upload has nothing to send.
          cat > .appstoreconnect/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build & sign .pkg (xcodebuild, manual signing)
        run: |
          set -euo pipefail
          # Same "archive unsigned, sign at export" pattern as iOS: CI holds only
          # the Distribution private key, and a bare archive would demand a
          # Development identity it cannot have.
          PATH="/usr/bin:$PATH" flutter build macos --release --config-only
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT \
            pod install --project-directory=macos
          PATH="/usr/bin:$PATH" xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath build/macos/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/macos/archive/Runner.xcarchive \
            -exportPath build/macos/pkg \
            -exportOptionsPlist .appstoreconnect/ExportOptions.plist
          PKG=$(ls build/macos/pkg/*.pkg | head -1)
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "built: $PKG"
          pkgutil --check-signature "$PKG" | head -5

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: cometbeat-pkg
          path: cometbeat/build/macos/pkg/*.pkg
          if-no-files-found: error

      - name: Validate with App Store Connect
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Validating $VER (build $BUILD)"
          # Validate ALWAYS, including on a dry run — it is the cheap check that
          # catches a bad signature or a duplicate build number before upload.
          xcrun altool --validate-app -f "$PKG" --type macos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Uploading $VER (build $BUILD)"
          # ⚠️ camelCase --apiKey/--apiIssuer here, unlike the iOS job's
          # --api-key/--api-issuer. altool accepts both spellings for
          # --upload-package but only camelCase for --validate-app, so this job
          # uses one spelling throughout.
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VER" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
