name: CI

# Analyze + test on every push to main and every PR. The app has a path
# dependency on the sibling `crisp_notation` library (../crisp_notation), so we lay the
# two repos out as siblings in the workspace and run from within this one.

on:
  push:
    branches: [main]
    # Skip the run when a commit changes NOTHING but prose. Measured before
    # adding this: 31 of 60 consecutive commits touched only `docs/` or a
    # `.md`, and each still burned the full ~22-min test job plus the ~8-min
    # Android build. The queue routinely sat 17 deep, which starved the
    # path-triggered native workflows and delayed every real red by ~20 min.
    #
    # ⚠️ READ THE SEMANTICS BEFORE EDITING. GitHub skips only when EVERY
    # changed file matches, so a commit touching code AND docs still runs in
    # full. That property is the whole safety argument — widening these
    # patterns to anything code-adjacent would let real changes reach main
    # unvalidated, which is far worse than a slow queue. Verified when added
    # that no test reads a `.md` as a fixture (the `README.md` strings in
    # `github_abc_source_test` / `vcsl_source_test` are inline JSON mocks of a
    # GitHub API response, not file reads) and that nothing under `docs/` is
    # bundled or asserted on.
    #
    # Applied to `pull_request` too since 2026-11-03 (CI trim): the shared
    # free-tier runner pool had 130+ queued runs, and a prose-only PR is as
    # much a no-op as a prose-only main commit. The full-CI escape hatch that
    # the unfiltered PR trigger used to provide is now `workflow_dispatch`
    # (Actions -> CI -> Run workflow, on any branch): it always runs everything.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Group per PR (a new push to a PR cancels its superseded run) but per RUN for
# everything else (github.run_id is unique, so main pushes and manual runs are
# NEVER cancelled — every commit runs a full CI to completion, in parallel).
# During heavy multi-agent development a single `group: ${{ github.ref }}` made
# rapid main pushes cancel each other, so regressions reached main with their
# validating run cancelled (never green, never red — just "cancelled").
# Per-SHA did the same job until 2026-11-03; per-run_id additionally keeps a
# dispatch on an already-tested SHA from cancelling (or being cancelled by) it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which expensive jobs this PR needs. Cheap (reads the PR's file list, no
  # Flutter). PR-only: main pushes and manual runs need no classification.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'native/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/ci.yml'

  # Analyze + format + full test suite: runs on EVERY code change (no gate).
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cometbeat
        uses: actions/checkout@v5
        with:
          path: cometbeat

      # crisp_notation + crisp_notation_core are resolved via ../crisp_notation/... path deps.
      - name: Checkout crisp_notation (sibling path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/crisp_notation
          ref: main
          path: crisp_notation

      # crispembed is a native FFI path dep (../CrispEmbed/flutter/crispembed);
      # pub get needs the sibling present even where the plugin isn't built.
      - name: Checkout CrispEmbed (sibling FFI path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/CrispEmbed
          ref: main
          path: CrispEmbed

      # onnx_runtime_dart is a dev_dependency (headless AECMOS eval in bin/); pub
      # get resolves dev deps, so the sibling must be present even for app builds.
      - name: Checkout onnx_runtime_dart (sibling dev path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/onnx_runtime_dart
          ref: main
          path: onnx_runtime_dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: cometbeat
        run: flutter pub get

      - name: Verify formatting
        working-directory: cometbeat
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: cometbeat
        # The remedy is printed HERE, at the moment someone sees the red,
        # because putting it in a doc did not work: `require_trailing_commas`
        # has failed this step FOUR times, always a different agent. The trap is
        # that `dart format` cannot fix that lint, and our documented pre-commit
        # order (format, then analyze) stops one step short — so a perfectly
        # formatted file is still a red one. `dart fix --apply` does fix it.
        # Exit code is unchanged; this only adds output on the failure path.
        run: |
          flutter analyze || {
            echo "::error::flutter analyze failed — most reds here are auto-fixable."
            echo "Run this, in this order, then push again:"
            echo "    dart fix --apply && dart format . && flutter analyze"
            echo "dart format ALONE does not fix require_trailing_commas, which"
            echo "is how four of these reached main. Analyze covers test/ too."
            exit 1
          }

      # Without ffmpeg, `mp3_decode_roundtrip_test` self-skips with "ffmpeg not
      # on PATH" and CI stays green having tested NOTHING of MP3 decoding —
      # which is precisely where the 23 ms gapless-delay bug lived. Measured:
      # the suite skipped 31 here against 26 locally, and the difference was
      # exactly these 5. They pass locally with ffmpeg present, so the gap was
      # the runner image, not the tests.
      - name: Install ffmpeg (the MP3 round-trips self-skip without it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        working-directory: cometbeat
        run: flutter test --coverage

      # The web variants of the codec seams are dart:js_interop, so the VM run
      # above never executes them — it compiles the dart:ffi ones instead.
      # Chrome is the only place the conditional export picks the web files.
      - name: Test (web seams, in Chrome)
        working-directory: cometbeat
        run: flutter test test/web --platform chrome

      - name: Upload coverage
        # v7: v5 is the last Node-20 action left in this workflow. `name`,
        # `path` and `if-no-files-found` are the only inputs used and all three
        # are unchanged in v7.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: cometbeat/coverage/lcov.info
          if-no-files-found: warn

  # The app's Android build. Added 2026-07-26, when it first succeeded: it had
  # been broken by a chain of three unrelated issues (crispembed calling the
  # Gradle-9-removed Project.exec(), onnxruntime pinning compileSdk 33 against a
  # dependency needing >=34, and the iOS-side blocker), and because nothing here
  # ever built Android, all three sat undetected. Guard it so that cannot recur.
  #
  # Gate (2026-11-03, CI trim): on a PR it runs only when the change can affect
  # the Android packaging — android/, native/ (FFI plugins incl. glint), assets/,
  # pubspec.yaml/.lock, or this workflow. A Dart-only PR is already compiled by
  # analyze-and-test. On main pushes and manual runs it ALWAYS runs, so drift in
  # the sibling repos (CrispEmbed main etc. — how the original three breaks
  # arrived) is still caught on the next main commit.
  android-build:
    needs: changes
    # !cancelled(): `changes` is skipped on non-PR events, and a skipped
    # dependency would otherwise skip this job too.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cometbeat
        uses: actions/checkout@v5
        with:
          path: cometbeat

      - name: Checkout crisp_notation (sibling path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/crisp_notation
          ref: main
          path: crisp_notation

      - name: Checkout CrispEmbed (sibling FFI path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/CrispEmbed
          ref: main
          path: CrispEmbed

      - name: Checkout onnx_runtime_dart (sibling dev path dependency)
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/onnx_runtime_dart
          ref: main
          path: onnx_runtime_dart

      # v5, not v4: v4 runs on Node 20, which GitHub has deprecated and is
      # already force-running on Node 24. Nothing is red yet — this is the
      # scheduled break, taken early. Only `distribution` + `java-version` are
      # used and neither changed in v5.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: cometbeat
        run: flutter pub get

      - name: Build debug APK
        working-directory: cometbeat
        run: flutter build apk --debug

      # The whole point of vendoring the codec: it has to reach the device.
      - name: The glint encoder is actually in the APK
        working-directory: cometbeat
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/.*/libglint_vorbis\.so' || {
            echo "libglint_vorbis.so missing from the APK"; exit 1; }
