name: glint_vorbis
description: >-
  Native glint codecs (MIT) compiled into CometBeat as a Flutter FFI plugin:
  DECODE Ogg-Vorbis (.sf3 SoundFonts) and FLAC (SFZ samples), ENCODE MP3 /
  AAC-LC / Ogg-Opus for audio export. Exposes glint_vorbis_decode,
  glint_flac_decode, glint_encode_audio and glint_free. Reached via the
  capability seams in lib/core/audio/sf2/. Re-vendor with sync_glint.sh.
  (Package name is historical — it predates the FLAC and encode sets.)
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    # FFI plugin: the tooling builds + bundles the native code. C++ is shared
    # across platforms via src/CMakeLists.txt (Android/Linux/Windows) and the
    # podspec Classes/ forwarders (macOS/iOS).
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
